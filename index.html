<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Riri's Portfolio</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="autumn-icon">🍂 🍁 🍂</div>

        <h1>LOGIN</h1>

        <p>
            Selamat datang di halaman portfolio Riri!
            Silakan masukkan username dan password
            untuk melihat CV dan Surat Lamaran Kerja.
        </p>

        <form action="index.html" method="POST">

            <div class="form-group">
                <label for="Username">Username</label>

                <input
                    type="text"
                    id="Username"
                    name="Username"
                    placeholder="Masukkan Username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="Password">Password</label>

                <input
                    type="password"
                    id="Password"
                    name="Password"
                    placeholder="Masukkan Password"
                    required
                >
            </div>

            <button type="submit">
                Masuk →
            </button>

        </form>

        <div class="footer">
            <p> Welcome to my placee🍂🍁 </p>
        </div>

    </div>

</body>
</html>
